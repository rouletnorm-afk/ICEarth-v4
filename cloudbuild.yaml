substitutions:
  _IMAGE_NAME: 'us-east1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/icearth-v3:${COMMIT_SHA}'
  _SERVICE_NAME: 'roulet-s-law-book-icearth-platform'
  _REGION: 'us-east1'

steps:
  # Step 1: Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_IMAGE_NAME'
      - '.'

  # Step 2: Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_IMAGE_NAME'

  # Step 3: Strip stale source annotations from Cloud Run service if present
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run services update $_SERVICE_NAME --region=$_REGION --remove-annotations="run.googleapis.com/sources,run.googleapis.com/source-location" --quiet || true

  # Step 4: Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_IMAGE_NAME'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--quiet'
      - '--allow-unauthenticated'

images:
  - '$_IMAGE_NAME'

options:
  logging: CLOUD_LOGGING_ONLY




